tags:
  - Contacts by ID
summary: Update a contact
operationId: updateContact
description: Partial update of an existing contact by ID
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: 68b757f3cf5af6d9d4b6c015
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: ../../../components/schemas/updateContact.yaml
    multipart/form-data:
      schema:
        type: object
        minProperties: 1
        properties:
          name:
            type: string
            minLength: 3
            maxLength: 20
          phoneNumber:
            type: string
            minLength: 3
            maxLength: 20
          email:
            type: string
            minLength: 3
            maxLength: 20
          isFavourite:
            type: boolean
          contactType:
            type: string
            enum: [personal, home, work]
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Оновлено
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully patched a contact'
            data:
              $ref: ../../../components/schemas/contact.yaml
  '400':
    $ref: ../../../components/responses/400.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
