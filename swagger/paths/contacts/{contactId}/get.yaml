# swagger/paths/studens/{id}/get.yaml
tags:
  - Contacts by ID
summary: Get a contact by id
operationId: getContactById
description: 'Get a single contact by its id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '68b771fb108dd0b0ecbf8386'
responses:
  '200':
    description: 'Get a contact by id'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with id 68b771fb108dd0b0ecbf8386
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
