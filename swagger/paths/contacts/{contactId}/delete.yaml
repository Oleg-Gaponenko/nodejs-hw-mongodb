    name: contactId
    required: true
    schema:
      type: string
      example: '68b771fb108dd0b0ecbf8386'
responses:
  '204':
    description: Deleted (no body)
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
