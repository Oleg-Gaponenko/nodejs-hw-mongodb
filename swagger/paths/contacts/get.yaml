tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Return a list of all user's contacts.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      minimum: 1
      default: 1
      example: 1

  - in: query
    name: perPage
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 10
      example: 10

  - in: query
    name: sortBy
    schema:
      type: string
      example: name

  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [asc, desc]
      default: asc
      example: asc

  - in: query
    name: type
    schema:
      type: string
      enum: [work, home, personal]
      example: home

  - in: query
    name: isFavourite
    schema:
      type: boolean
      example: true

responses:
  '200':
    description: ОК
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully found contacts!'
            data:
              type: array
              items:
                $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
