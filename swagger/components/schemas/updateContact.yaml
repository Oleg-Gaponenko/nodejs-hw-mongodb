type: object
minProperties: 1
properties:
  name:
    type: string
    minLength: 3
    maxLength: 20
    example: 'Doctor Who'
  phoneNumber:
    type: string
    minLength: 3
    maxLength: 20
    example: '+380951112233'
  email:
    type: string
    minLength: 3
    maxLength: 20
    example: 'who@mail.com'
  isFavourite:
    type: boolean
    example: false
  contactType:
    type: string
    enum: [personal, home, work]
    example: home
  photo:
    type: string
    format: uri
    example: 'https://res.cloudinary.com/dk3rubwon/image/upload/v1756854772/images/68b757f3cf5af6d9d4b6c015/olvalxrxi76vugtt4ul8.jpg'
