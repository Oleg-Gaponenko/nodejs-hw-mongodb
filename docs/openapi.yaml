openapi: 3.1.0
info:
  version: 1.0.0
  title: <Contacts app>
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: <The application documentation to manage contacts>
tags:
  - name: Contacts
    description: Processing and managing contacts
  - name: Contacts by ID
    description: Processing and managing contacts by ID
servers:
  - url: http://localhost:3000
  - url: https://app-contacts-rqnm.onrender.com
paths:
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml
    post:
      $ref: ../swagger/paths/contacts/post.yaml
  /contacts/{contactId}:
